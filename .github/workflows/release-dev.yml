name: Release frontend dev

on:
  push:
    branches:
      - my-fork
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that stores remnawave-frontend.zip
        required: false
        default: dev-build

permissions:
  contents: read

env:
  DEV_RELEASE_TAG: dev-build
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  send-start-deploy-telegram-message:
    name: Send Telegram message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send Telegram message
        if: ${{ env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: proDreams/actions-telegram-notifier@a031dcd7087ef9fad3de9f67cd6ba116c5f9052b
        with:
          token: ${{ env.TELEGRAM_TOKEN }}
          chat_id: ${{ env.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: info
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build frontend:${{ github.ref_name }} build started'

  build-and-release:
    name: Build and release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: Install dependencies
        run: |
          npm ci

      - name: Prepare release metadata
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          RELEASE_TAG="${INPUT_RELEASE_TAG:-$DEV_RELEASE_TAG}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload sources
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: |
          if [ -z "$CROWDIN_PROJECT_ID" ] || [ -z "$CROWDIN_API_TOKEN" ]; then
            echo "Crowdin secrets are not configured; skipping upload."
            exit 0
          fi

          npm run crowdin:upload

      - name: Build
        run: |
          npm run start:build

      - name: Create ZIP archive of /dist
        run: |
          zip -r remnawave-frontend.zip ./dist

      - name: Ensure release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.release.outputs.tag }}" \
              --title "${{ steps.release.outputs.tag }}" \
              --notes "Development build" \
              --target "$GITHUB_SHA" \
              --prerelease

      - name: Remove previous ZIP from release (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset "${{ steps.release.outputs.tag }}" remnawave-frontend.zip || true

      - name: Upload new ZIP to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" remnawave-frontend.zip --clobber

      - name: Update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          gh release edit "${{ steps.release.outputs.tag }}" --target "$GITHUB_SHA" --notes-file - <<EOF
          🔄 Updated development build
          🔗 [Commit]($COMMIT_URL)  
          📅 Built: $DATE
          EOF

  send-telegram-message:
    name: Send Telegram message
    needs: [build-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send Telegram message
        if: ${{ env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: proDreams/actions-telegram-notifier@a031dcd7087ef9fad3de9f67cd6ba116c5f9052b
        with:
          token: ${{ env.TELEGRAM_TOKEN }}
          chat_id: ${{ env.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: success
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build frontend:${{ github.ref_name }} build finished'

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [build-and-release]
    if: failure()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Send Telegram message
        if: ${{ env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: proDreams/actions-telegram-notifier@a031dcd7087ef9fad3de9f67cd6ba116c5f9052b
        with:
          token: ${{ env.TELEGRAM_TOKEN }}
          chat_id: ${{ env.TELEGRAM_CHAT_ID }}
          thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          status: error
          notify_fields: 'repository,branch,commit,workflow'
          title: 'Build frontend:${{ github.ref_name }} build failed'
